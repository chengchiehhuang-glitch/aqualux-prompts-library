<style>
  :root{
    --bg:#ffffff;
    --bg-paper:#fafaf5;
    --ink:#1a1a1a;
    --ink-light:#4a4a4a;
    --ink-muted:#8a8a8a;
    --accent:#5c7a9a;
    --line:#e8e6e0;
    --font-display:'Noto Serif TC','Source Han Serif','Songti TC',serif;
    --font-body:'Noto Sans TC','PingFang TC',sans-serif;
    --font-num:'Cormorant Garamond','Noto Serif TC',serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-weight:300;-webkit-font-smoothing:antialiased;line-height:1.6}
  ::selection{background:var(--bg-paper);color:var(--ink)}

  /* ---------- Layout shell ---------- */
  .wrap{max-width:780px;margin:0 auto;padding:0 32px}
  @media(max-width:640px){.wrap{padding:0 24px}}

  /* ---------- Hero ---------- */
  .hero{padding:180px 0 140px;text-align:center}
  .hero .mark{font-family:var(--font-num);font-style:italic;font-weight:300;font-size:14px;letter-spacing:.18em;color:var(--ink-muted);margin-bottom:48px;text-transform:uppercase}
  .hero h1{font-family:var(--font-display);font-weight:300;font-size:104px;line-height:1.05;letter-spacing:.04em;color:var(--ink);margin-bottom:36px}
  .hero .en{font-family:var(--font-num);font-style:italic;font-weight:300;font-size:22px;color:var(--ink-light);letter-spacing:.05em;margin-bottom:64px}
  .hero .meta{font-family:var(--font-body);font-weight:300;font-size:13px;color:var(--ink-muted);letter-spacing:.12em}
  .hero .meta span{margin:0 12px;color:var(--line)}
  @media(max-width:640px){
    .hero{padding:96px 0 80px}
    .hero h1{font-size:64px}
    .hero .en{font-size:17px;margin-bottom:48px}
  }

  /* ---------- Search ---------- */
  .search{display:flex;justify-content:center;margin-top:56px}
  .search input{
    border:none;border-bottom:1px solid var(--line);
    background:transparent;font-family:var(--font-display);font-weight:300;
    font-size:15px;color:var(--ink);padding:10px 8px;width:240px;text-align:center;
    transition:border-color .3s ease,width .3s ease;outline:none;letter-spacing:.05em;
  }
  .search input::placeholder{color:var(--ink-muted);font-style:italic;font-family:var(--font-num)}
  .search input:focus{border-color:var(--ink);width:320px}

  /* ---------- Category nav ---------- */
  .cats{
    border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    padding:32px 0;margin:0 0 120px;
  }
  .cats-inner{display:flex;flex-wrap:wrap;justify-content:center;gap:36px 44px}
  .cat{
    background:none;border:none;cursor:pointer;
    font-family:var(--font-display);font-weight:300;font-size:15px;
    color:var(--ink-light);letter-spacing:.08em;padding:6px 0;
    border-bottom:1px solid transparent;transition:color .3s ease,border-color .3s ease;
  }
  .cat .n{font-family:var(--font-num);font-style:italic;font-size:13px;color:var(--ink-muted);margin-left:6px}
  .cat:hover{color:var(--ink)}
  .cat.active{color:var(--ink);border-bottom-color:var(--ink)}
  @media(max-width:640px){.cats-inner{gap:20px 28px}.cat{font-size:13px}}

  /* ---------- Chapter heading ---------- */
  .chapter{margin:160px 0 100px;text-align:center}
  .chapter:first-child{margin-top:0}
  .chapter .num{font-family:var(--font-num);font-style:italic;font-weight:300;font-size:48px;color:var(--ink-muted);letter-spacing:.05em;margin-bottom:24px;line-height:1}
  .chapter h2{font-family:var(--font-display);font-weight:300;font-size:36px;letter-spacing:.2em;color:var(--ink);margin-bottom:16px}
  .chapter .sub{font-family:var(--font-num);font-style:italic;font-weight:300;font-size:16px;color:var(--ink-muted);letter-spacing:.08em}
  .chapter .rule{width:32px;height:1px;background:var(--ink-muted);margin:32px auto 0}
  @media(max-width:640px){.chapter{margin:96px 0 64px}.chapter h2{font-size:24px}.chapter .num{font-size:36px}}

  /* ---------- Prompt entry ---------- */
  .entry{margin-top:110px;position:relative}
  .entry:first-of-type{margin-top:0}
  .entry .head{display:grid;grid-template-columns:96px 1fr;gap:32px;align-items:baseline;margin-bottom:36px}
  .entry .numeral{font-family:var(--font-num);font-style:italic;font-weight:300;font-size:88px;line-height:1;color:#dcd8cf;text-align:right;padding-top:8px;letter-spacing:-.02em}
  .entry .titlebox{padding-top:18px}
  .entry h3{font-family:var(--font-display);font-weight:400;font-size:26px;letter-spacing:.04em;color:var(--ink);margin-bottom:14px;line-height:1.4}
  .entry .useCase{font-family:var(--font-display);font-weight:300;font-size:14px;color:var(--ink-light);letter-spacing:.06em;margin-bottom:14px}
  .entry .tags{display:flex;flex-wrap:wrap;gap:18px;font-family:var(--font-num);font-style:italic;font-size:12px;color:var(--ink-muted);letter-spacing:.05em}
  .entry .tags span::before{content:"—  ";color:var(--line)}
  .entry .tags span:first-child::before{content:""}

  .entry .body{
    background:var(--bg-paper);padding:56px 64px;margin-left:128px;
    font-family:var(--font-body);font-weight:300;font-size:15.5px;line-height:1.95;
    color:var(--ink);letter-spacing:.02em;position:relative;

  .entry .body p{margin-bottom:0}
  .entry .body[data-lang=en]{font-family:var(--font-num);font-style:italic;font-size:17px;letter-spacing:.01em}

  .entry .actions{display:flex;justify-content:flex-end;align-items:center;gap:24px;margin-top:18px;margin-left:128px}
  .entry .accent-mark{width:24px;height:1px;background:var(--accent);opacity:.6}
  .copy{
    background:none;border:none;cursor:pointer;
    font-family:var(--font-display);font-weight:300;font-size:13px;
    color:var(--ink-muted);letter-spacing:.18em;padding:4px 0;
    transition:color .4s ease;
  }
  .copy:hover{color:var(--ink)}
  .copy.copied{color:var(--accent)}

  .entry .divider{margin-top:90px;height:1px;background:var(--line);max-width:64px;margin-left:auto;margin-right:auto}
  .entry:last-child .divider{display:none}

  @media(max-width:640px){
    .entry{margin-top:72px}
    .entry .head{grid-template-columns:48px 1fr;gap:18px;margin-bottom:24px}
    .entry .numeral{font-size:52px;padding-top:6px}
    .entry .titlebox{padding-top:10px}
    .entry h3{font-size:20px}

    .entry .actions{margin-left:0}

  }

    text-align:center;padding:140px 0;color:var(--ink-muted);
    font-family:var(--font-display);font-weight:300;font-size:15px;letter-spacing:.15em;
  }
  .empty .num{font-family:var(--font-num);font-style:italic;font-size:48px;color:var(--ink-muted);margin-bottom:20px;letter-spacing:.05em}

    footer{margin-top:120px;padding:56px 0 80px}
    footer .line{font-size:11px;letter-spacing:.12em}
    footer .line span{margin:0 8px}
  }
</style>

/* ---------- Helpers ---------- */
const HAN_NUM = ["零","壹","貳","參","肆","伍","陸","柒","捌","玖","拾"];
function hanNum(n){
  if(n<=10) return HAN_NUM[n];
  if(n<20) return "拾"+HAN_NUM[n-10];
  const t=Math.floor(n/10), o=n%10;
  return HAN_NUM[t]+"拾"+(o?HAN_NUM[o]:"");
}
function romanLower(n){
  const map=[[10,"x"],[9,"ix"],[5,"v"],[4,"iv"],[1,"i"]];
  let r="";for(const[v,s]of map){while(n>=v){r+=s;n-=v;}}return r;
}

let state = { cat: "all", q: "" };

/* ---------- Render category nav ---------- */
function renderCats(){
  const nav = document.getElementById("catNav");
  const total = data.prompts.length;
  const cats = [{id:"all",zh:"全部",en:"All",count:total},...data.categories];
  nav.innerHTML = cats.map(c=>{
    const inSample = c.id==="all" ? total : data.prompts.filter(p=>p.category===c.id).length;
    return `<button class="cat ${state.cat===c.id?"active":""}" data-id="${c.id}">${c.zh}<span class="n">${String(inSample).padStart(2,"0")}</span></button>`;
  }).join("");
  nav.querySelectorAll(".cat").forEach(b=>{
    b.addEventListener("click",()=>{
      state.cat = b.dataset.id;
      renderCats();
      renderList();
      const m = document.getElementById("list");
      window.scrollTo({top: m.offsetTop - 32, behavior:"smooth"});
    });
  });
}

/* ---------- Render list ---------- */
function renderList(){
  const main = document.getElementById("list");
  const q = state.q.trim().toLowerCase();
  let prompts = data.prompts.filter(p=>{
    if(state.cat!=="all" && p.category!==state.cat) return false;
    if(!q) return true;
    return (p.title+p.useCase+p.prompt+p.tags.join(" ")).toLowerCase().includes(q);
  });

  if(prompts.length===0){
    main.innerHTML = `<div class="empty"><div class="num">∅</div>未尋得相應之詞</div>`;
    return;
  }

  /* Group by category for chapter rhythm */
  const groups = {};
  for(const p of prompts){ (groups[p.category] = groups[p.category] || []).push(p); }
  const catOrder = data.categories.map(c=>c.id).filter(id=>groups[id]);

  let html = "";
  let chapterIdx = 0;
  let entryIdx = 0;
  for(const cid of catOrder){
    const catMeta = data.categories.find(c=>c.id===cid);
    chapterIdx++;
    html += `
      <section class="chapter">
        <div class="num">${romanLower(chapterIdx)}.</div>
        <h2>${catMeta.zh}</h2>
        <div class="sub">${catMeta.en}</div>
        <div class="rule"></div>
      </section>
    `;
    for(const p of groups[cid]){
      entryIdx++;
      const numeral = hanNum(entryIdx);
      const tags = p.tags.map(t=>`<span>${t}</span>`).join("");
      html += `
        <article class="entry" id="${p.id}">
          <div class="head">
            <div class="numeral">${numeral}</div>
            <div class="titlebox">
              <h3>${p.title}</h3>
              <div class="useCase">${p.useCase}</div>
              <div class="tags">${tags}</div>
            </div>
          </div>
          <div class="body" data-lang="${p.lang}"><p>${p.prompt}</p></div>
          <div class="actions">
            <span class="accent-mark"></span>
            <button class="copy" data-id="${p.id}">複製</button>
          </div>
          <div class="divider"></div>
        </article>
      `;
    }
  }

  main.innerHTML = html;

  /* Copy */
  main.querySelectorAll(".copy").forEach(btn=>{
    btn.addEventListener("click", async ()=>{
      const p = data.prompts.find(x=>x.id===btn.dataset.id);
      if(!p) return;
      try{
        await navigator.clipboard.writeText(p.prompt);
        btn.textContent = "已複製";
        btn.classList.add("copied");
        setTimeout(()=>{ btn.textContent="複製"; btn.classList.remove("copied"); }, 1800);
      }catch(e){
        btn.textContent = "請手動複製";
        setTimeout(()=>{ btn.textContent="複製"; }, 1800);
      }
    });
  });
}

/* ---------- Search ---------- */
document.getElementById("q").addEventListener("input", e=>{
  state.q = e.target.value;
  renderList();
});

/* ---------- Init ---------- */
renderCats();
renderList();
</script>
</body>
